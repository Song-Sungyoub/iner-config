name: Build and release
on:
  push:
    branches: [main]
    paths: [InerConfig.csproj, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iner-config-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'Song-Sungyoub/iner-config' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build installer
        run: ./Installer/Build.ps1
      - name: Test packaged application and updater
        run: |
          $version = ([xml](Get-Content InerConfig.csproj -Raw)).Project.PropertyGroup.Version
          $msi = (Resolve-Path "dist/InerConfig-$version-x64.msi").Path
          $test = Start-Process ./dist/portable-win-x64/InerConfig.exe -ArgumentList @('--self-test', ('"' + $msi + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($test.ExitCode -ne 0) {
            Get-Content ./dist/portable-win-x64/self-test-error.txt -ErrorAction SilentlyContinue
            throw 'Packaged application tests failed.'
          }
          Get-Content ./dist/portable-win-x64/self-test-result.txt
          ./Installer/Test-Updater.ps1 -CommandFile ./dist/portable-win-x64/self-test-updater.ps1
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content InerConfig.csproj -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          $msi = "dist/InerConfig-$version-x64.msi"
          function Invoke-Gh([string[]]$Arguments) {
            $output = & gh @Arguments 2>&1
            if ($LASTEXITCODE -ne 0) {
              $message = ($output | Out-String).Trim().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$message"
              throw 'GitHub release operation failed.'
            }
            return $output
          }
          $releases = Invoke-Gh @('api', "repos/$env:GITHUB_REPOSITORY/releases?per_page=100") | ConvertFrom-Json
          $release = $releases | Where-Object tag_name -eq "v$version"
          if ($release -and -not $release.draft) { throw 'Published releases are never overwritten; increase the version.' }
          if ($release) {
            Invoke-Gh @('release', 'edit', "v$version", '--target', $env:GITHUB_SHA, '--notes-file', 'RELEASE-NOTES.md')
            Invoke-Gh @('release', 'upload', "v$version", $msi, '--clobber')
          } else {
            Invoke-Gh @('release', 'create', "v$version", $msi, '--target', $env:GITHUB_SHA, '--title', "InerConfig $version", '--notes-file', 'RELEASE-NOTES.md', '--draft')
          }
          $releases = Invoke-Gh @('api', "repos/$env:GITHUB_REPOSITORY/releases?per_page=100") | ConvertFrom-Json
          $release = $releases | Where-Object tag_name -eq "v$version"
          if (-not $release -or -not $release.draft) { throw 'Expected an unpublished release.' }
          $asset = @($release.assets | Where-Object name -eq "InerConfig-$version-x64.msi")
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset.Count -ne 1 -or $asset[0].digest -ne "sha256:$hash" -or $asset[0].size -ne (Get-Item $msi).Length) { throw 'Uploaded installer verification failed; release remains a draft.' }
          Invoke-Gh @('release', 'edit', "v$version", '--draft=false', '--latest')
